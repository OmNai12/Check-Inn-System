version: '3.8'

services:
  app:
    build: . # Assuming you have a Dockerfile in the current directory
    image: my-java-app  # Replace with your built Java app image
    container_name: my-java-app
    depends_on:
      - postgres
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/CheckInnSystem1
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=diya1234
    ports:
      - "8090:8090"

  postgres:
    image: postgres:latest
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: CheckInnSystem1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: diya1234
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  default:
    driver: bridge

volumes:
  postgres_data: